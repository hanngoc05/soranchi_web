<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="chatbot" th:if="${session.loggedInUser == null or session.loggedInUser.role != 'ADMIN'}">
    <!-- Nút mở Chatbot nổi góc dưới bên phải -->
    <button id="chatbot-toggle-btn" type="button"
            class="btn btn-dark rounded-circle shadow-lg d-flex align-items-center justify-content-center"
            style="position: fixed; bottom: 24px; right: 24px; width: 58px; height: 58px; z-index: 1050; border: 2px solid #d4a017;">
        <i class="fas fa-robot text-warning fs-4"></i>
    </button>

    <!-- Khung chat -->
    <div id="chatbot-window" class="card border-0 shadow-lg rounded-4 overflow-hidden d-none"
         style="position: fixed; bottom: 92px; right: 24px; width: 360px; max-width: calc(100vw - 32px); z-index: 1050;">
        
        <div class="card-header bg-dark text-white px-3 py-2.5 d-flex justify-content-between align-items-center"
             style="border-bottom: 2px solid #d4a017;">
            <div class="d-flex align-items-center gap-2">
                <i class="fas fa-robot text-warning"></i>
                <div>
                    <div class="fw-bold small mb-0">Trợ lý AI Soranchi</div>
                    <div class="text-success" style="font-size: 11px;">● Sẵn sàng tư vấn thực đơn</div>
                </div>
            </div>
            <button id="chatbot-close-btn" type="button" class="btn-close btn-close-white btn-sm"></button>
        </div>

        <!-- Vùng hiển thị tin nhắn -->
        <div id="chatbot-messages" class="card-body p-3 bg-light" style="height: 340px; overflow-y: auto; font-size: 0.87rem;">
            <div class="d-flex justify-content-start mb-2">
                <div class="bg-white border rounded-3 px-3 py-2 shadow-sm text-dark" style="max-width: 85%;">
                    Xin chào! Mình là trợ lý AI của <strong>Soranchi Tea</strong>. Bạn cần tư vấn món trà sữa, topping hay ưu đãi nào hôm nay ạ?
                </div>
            </div>
        </div>

        <!-- Ô nhập câu hỏi -->
        <div class="card-footer bg-white border-top p-2">
            <form id="chatbot-form" class="d-flex gap-2">
                <input type="text" id="chatbot-input" class="form-control form-control-sm rounded-3"
                       placeholder="Nhập câu hỏi về trà sữa..." autocomplete="off">
                <button type="submit" id="chatbot-send-btn" class="btn btn-dark btn-sm px-3 rounded-3 fw-semibold">
                    <i class="fas fa-paper-plane text-warning"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const toggleBtn = document.getElementById('chatbot-toggle-btn');
            const closeBtn = document.getElementById('chatbot-close-btn');
            const chatWindow = document.getElementById('chatbot-window');
            const chatMessages = document.getElementById('chatbot-messages');
            const chatForm = document.getElementById('chatbot-form');
            const chatInput = document.getElementById('chatbot-input');
            let historyLoaded = false;

            function appendMessage(role, text, isError = false) {
                const wrapper = document.createElement('div');
                wrapper.className = 'd-flex mb-2 ' + (role === 'USER' ? 'justify-content-end' : 'justify-content-start');

                const bubble = document.createElement('div');
                if (role === 'USER') {
                    bubble.className = 'bg-dark text-white rounded-3 px-3 py-2 shadow-sm';
                } else if (isError) {
                    bubble.className = 'bg-danger-subtle text-danger border border-danger-subtle rounded-3 px-3 py-2';
                } else {
                    bubble.className = 'bg-white border text-dark rounded-3 px-3 py-2 shadow-sm';
                }
                bubble.style.maxWidth = '85%';
                bubble.style.whiteSpace = 'pre-line';
                bubble.innerText = text;

                wrapper.appendChild(bubble);
                chatMessages.appendChild(wrapper);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            toggleBtn.addEventListener('click', function () {
                chatWindow.classList.toggle('d-none');
                if (!chatWindow.classList.contains('d-none')) {
                    chatInput.focus();
                    if (!historyLoaded) {
                        fetch('/api/chatbot/history')
                            .then(r => r.json())
                            .then(data => {
                                if (data.messages && data.messages.length > 0) {
                                    data.messages.forEach(m => appendMessage(m.vaiTro, m.noiDung));
                                }
                                historyLoaded = true;
                            });
                    }
                }
            });

            closeBtn.addEventListener('click', function () {
                chatWindow.classList.add('d-none');
            });

            chatForm.addEventListener('submit', function (e) {
                e.preventDefault();
                const question = chatInput.value;

                if (!question || question.trim().length === 0 || question.trim().length > 500) {
                    appendMessage('BOT', 'Vui lòng nhập câu hỏi hợp lệ', true);
                    return;
                }

                appendMessage('USER', question.trim());
                chatInput.value = '';
                chatInput.disabled = true;

                const loadingId = 'bot-loading-' + Date.now();
                const loadingDiv = document.createElement('div');
                loadingDiv.id = loadingId;
                loadingDiv.className = 'd-flex justify-content-start mb-2';
                loadingDiv.innerHTML = '<div class="bg-white border rounded-3 px-3 py-2 text-muted small"><i>Đang suy nghĩ...</i></div>';
                chatMessages.appendChild(loadingDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                const formData = new FormData();
                formData.append('question', question.trim());

                fetch('/api/chatbot/send', { method: 'POST', body: formData })
                    .then(r => r.json())
                    .then(data => {
                        document.getElementById(loadingId)?.remove();
                        appendMessage('BOT', data.reply, !data.success);
                    })
                    .catch(() => {
                        document.getElementById(loadingId)?.remove();
                        appendMessage('BOT', 'Trợ lý đang bận, vui lòng thử lại sau hoặc liên hệ Hotline', true);
                    })
                    .finally(() => {
                        chatInput.disabled = false;
                        chatInput.focus();
                    });
            });
        });
    </script>
</div>
</body>
</html>
