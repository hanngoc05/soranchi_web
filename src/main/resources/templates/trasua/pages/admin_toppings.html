<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="container-fluid py-4 px-3 px-md-4">

    <!-- Tiêu đề & Nút Thêm -->
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <div>
            <h4 class="fw-bold text-dark mb-1">Quản lý Topping</h4>
            <p class="text-muted small mb-0">Quản lý danh sách, giá bán và trạng thái các loại topping trà sữa</p>
        </div>
        <button class="btn btn-dark btn-sm px-3 py-2 fw-semibold rounded-3 shadow-sm d-flex align-items-center gap-2"
                data-bs-toggle="modal" data-bs-target="#addToppingModal">
            <i class="fas fa-plus text-warning" style="font-size: 0.8rem;"></i>
            <span>Thêm</span>
        </button>
    </div>

    <!-- Thông báo kết quả -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm rounded-3 py-2.5 px-3 small" role="alert">
        <i class="fas fa-check-circle me-2 text-success"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show border-0 shadow-sm rounded-3 py-2.5 px-3 small" role="alert">
        <i class="fas fa-exclamation-circle me-2 text-danger"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Bảng danh sách topping (Mã, Tên, Giá bán, Trạng thái, Thao tác) -->
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" style="font-size: 0.88rem;">
                <thead style="background-color: #f8fafc; border-bottom: 1px solid #eef2f6;">
                    <tr class="text-secondary text-uppercase fw-semibold" style="font-size: 0.72rem; letter-spacing: 0.5px;">
                        <th class="ps-4 py-3">Mã Topping</th>
                        <th>Tên Topping</th>
                        <th>Giá bán</th>
                        <th class="text-center">Trạng thái</th>
                        <th class="text-end pe-4">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(toppings)}">
                        <td colspan="5" class="text-center py-5 text-muted">
                            Chưa có loại topping nào trong hệ thống.
                        </td>
                    </tr>
                    <tr th:each="t : ${toppings}">
                        <td class="ps-4 py-3 fw-bold text-secondary font-monospace" th:text="'TP-' + ${t.id}">TP-1</td>
                        <td class="fw-bold text-dark" th:text="${t.name}">Trân châu</td>
                        <td class="fw-bold text-danger" th:text="${#numbers.formatDecimal(t.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">6,000 VNĐ</td>
                        <td class="text-center">
                            <span th:if="${t.status == 'Đang bán'}" class="badge rounded-pill px-2.5 py-1 fw-medium"
                                  style="background-color: #ecfdf5; color: #059669; border: 1px solid #a7f3d0;">
                                Đang bán
                            </span>
                            <span th:if="${t.status != 'Đang bán'}" class="badge rounded-pill px-2.5 py-1 fw-normal"
                                  style="background-color: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0;">
                                Ngừng bán
                            </span>
                        </td>
                        <td class="text-end pe-4">
                            <div class="d-inline-flex align-items-center gap-1">
                                <!-- Nút Sửa -->
                                <button type="button" class="btn btn-sm btn-light border-0 text-secondary rounded-2 px-2 py-1"
                                        data-bs-toggle="modal" th:data-bs-target="'#editToppingModal' + ${t.id}" title="Sửa">
                                    <i class="far fa-edit"></i> Sửa
                                </button>

                                <!-- Nút Xóa (Rẽ nhánh 2: Hủy xác nhận thì giữ nguyên) -->
                                <a th:href="@{/admin/toppings/delete/{id}(id=${t.id})}"
                                   class="btn btn-sm btn-light border-0 text-danger rounded-2 px-2 py-1"
                                   onclick="return confirm('Bạn có chắc chắn muốn xóa topping này không?');" title="Xóa">
                                    <i class="far fa-trash-alt"></i> Xóa
                                </a>
                            </div>

                            <!-- Modal Sửa Topping (Bước 3.1) -->
                            <div class="modal fade text-start" th:id="'editToppingModal' + ${t.id}" tabindex="-1" aria-hidden="true">
                                <div class="modal-dialog modal-dialog-centered">
                                    <form th:action="@{/admin/toppings/save}" method="post" class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
                                        <input type="hidden" name="id" th:value="${t.id}">
                                        <div class="modal-header px-4 py-3 bg-light border-bottom">
                                            <h6 class="modal-title fw-bold text-dark mb-0">Sửa thông tin Topping</h6>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                        </div>
                                        <div class="modal-body p-4">
                                            <div class="mb-3">
                                                <label class="form-label small fw-semibold text-secondary">Tên topping</label>
                                                <input type="text" name="name" th:value="${t.name}" class="form-control rounded-3" required>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label small fw-semibold text-secondary">Giá bán (VNĐ)</label>
                                                <input type="number" name="price" th:value="${#numbers.formatInteger(t.price, 1)}" min="1" step="500" class="form-control rounded-3" required>
                                            </div>
                                            <div class="mb-2">
                                                <label class="form-label small fw-semibold text-secondary">Trạng thái</label>
                                                <select name="status" class="form-select rounded-3">
                                                    <option value="Đang bán" th:selected="${t.status == 'Đang bán'}">Đang bán</option>
                                                    <option value="Ngừng bán" th:selected="${t.status == 'Ngừng bán'}">Ngừng bán</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="modal-footer px-4 py-3 bg-light border-top">
                                            <button type="button" class="btn btn-light btn-sm px-3 rounded-3" data-bs-dismiss="modal">Hủy</button>
                                            <button type="submit" class="btn btn-dark btn-sm px-4 rounded-3 fw-medium">Lưu</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Thêm Topping (Bước 2.1) -->
    <div class="modal fade" id="addToppingModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form th:action="@{/admin/toppings/save}" method="post" class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="modal-header px-4 py-3 bg-light border-bottom">
                    <h6 class="modal-title fw-bold text-dark mb-0">Thêm Topping mới</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Tên topping</label>
                        <input type="text" name="name" class="form-control rounded-3" placeholder="Ví dụ: Trân châu trắng" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Giá bán (VNĐ)</label>
                        <input type="number" name="price" min="1" step="500" class="form-control rounded-3" placeholder="Ví dụ: 7000" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small fw-semibold text-secondary">Trạng thái</label>
                        <select name="status" class="form-select rounded-3">
                            <option value="Đang bán" selected>Đang bán</option>
                            <option value="Ngừng bán">Ngừng bán</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer px-4 py-3 bg-light border-top">
                    <button type="button" class="btn btn-light btn-sm px-3 rounded-3" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-dark btn-sm px-4 rounded-3 fw-medium">Lưu</button>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
