<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="w-100 p-3">
    <h4 class="fw-bold text-dark mb-4" style="border-left: 4px solid #d4a017; padding-left: 10px; letter-spacing: 0.5px;">
        🎁 CHƯƠNG TRÌNH KHUYẾN MẠI ĐANG DIỄN RA
    </h4>
    
    <div th:if="${#lists.isEmpty(promotions)}" class="text-muted p-5 text-center bg-white border rounded-4 shadow-sm font-monospace small">
        Hiện tại hệ thống Soranchi chưa có chương trình ưu đãi nào mới. Quý khách vui lòng quay lại sau!
    </div>

    <div class="row g-4" th:unless="${#lists.isEmpty(promotions)}">
        <div class="col-12 col-md-6" th:each="promo : ${promotions}">
            <div class="card h-100 border-0 shadow-sm rounded-4 bg-white border-top border-warning border-3 p-2 transition-card">
                <div class="card-body d-flex flex-column justify-content-between">
                    <div>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="badge bg-danger text-uppercase font-monospace px-2.5 py-1.5" style="font-size: 0.7rem; letter-spacing: 0.5px;" th:text="'GIẢM ' + ${promo.discountPercent} + '%'">
                                GIẢM 0%
                            </span>
                            <span class="small text-dark fw-bold font-monospace bg-light px-2 py-1 rounded border border-warning" th:text="'Mã: ' + ${promo.code}"></span>
                        </div>
                        
                        <h5 class="fw-bold text-dark mb-2" th:text="${promo.title}">Tiêu đề khuyến mại</h5>
                        <p class="text-secondary small mb-4" style="line-height: 1.6;" th:text="${promo.description}">Mô tả chi tiết chương trình ưu đãi...</p>
                    </div>
                    
                    <div class="small bg-light p-3 rounded-3 text-secondary border-0">
                        <i class="far fa-calendar-alt text-warning me-2"></i>
                        Thời gian áp dụng: 
                        <span class="fw-semibold text-dark" th:text="${promo.startDate}"></span> 
                        đến 
                        <span class="fw-semibold text-danger" th:text="${promo.endDate}"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        .transition-card {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            border: 1px solid #f1f3f5 !important;
        }
        .transition-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05) !important;
        }
    </style>
</div>
</body>
</html>
