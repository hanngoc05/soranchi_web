<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content" class="container py-5">
    <h2 class="fw-bold mb-4">GIỎ HÀNG CỦA BẠN</h2>
    
    <div th:if="${#lists.isEmpty(cartItems)}" class="text-center py-5 border rounded bg-light">
        <h4 class="text-muted">Giỏ hàng của bạn đang trống!</h4>
        <a th:href="@{/products}" class="btn btn-warning mt-3 fw-bold">TIẾP TỤC MUA SẮM</a>
    </div>

    <div th:if="${!#lists.isEmpty(cartItems)}" class="row">
        <div class="col-md-8">
            <table class="table align-middle table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Sản phẩm</th>
                        <th>Đơn giá</th>
                        <th class="text-center">Số lượng</th>
                        <th>Thành tiền</th>
                        <th>Xóa</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${cartItems}">
                        <td>
                            <div class="d-flex align-items-center">
                                <img th:src="@{'/image/' + ${item.imageUrl}}" style="width: 50px; height: 50px; object-fit: cover;" class="rounded me-3">
                                <div>
                                    <div class="fw-bold text-dark fs-6" 
                                         th:text="${item.name.contains('(') ? item.name.substring(0, item.name.indexOf('(')) : item.name}">
                                         Tên sản phẩm
                                    </div>
                                    
                                    <div th:if="${item.name.contains('(')}" 
                                         class="text-muted fw-normal mt-1" 
                                         style="font-size: 0.82rem; letter-spacing: 0.2px; line-height: 1.3;">
                                        <i class="fas fa-info-circle text-warning me-1"></i>
                                        <span th:text="${item.name.substring(item.name.indexOf('(') + 1, item.name.length() - 1)}">Ghi chú lựa chọn</span>
                                    </div>
                                </div>
                            </div>
                        </td>
                        <td th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + 'đ'">Giá</td>
                        
                        <td>
                            <form th:action="@{/cart/update}" method="post" class="d-flex justify-content-center align-items-center">
                                <input type="hidden" name="id" th:value="${item.id}">
                                <button type="submit" name="action" value="minus" class="btn btn-sm btn-outline-secondary px-2">-</button>
                                <span class="mx-3 fw-bold" th:text="${item.quantity}">1</span>
                                <button type="submit" name="action" value="plus" class="btn btn-sm btn-outline-secondary px-2">+</button>
                            </form>
                        </td>
                        
                        <td class="text-danger fw-bold" th:text="${#numbers.formatDecimal(item.price * item.quantity, 0, 'COMMA', 0, 'POINT')} + 'đ'"></td>
                        
                        <td>
                            <a th:href="@{/cart/remove/{id}(id=${item.id})}" class="btn btn-sm btn-danger">Xóa</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm border-0 bg-light">
                <div class="card-body">
                    <h5 class="card-title fw-bold border-bottom pb-2">TỔNG ĐƠN HÀNG</h5>
                    <div class="d-flex justify-content-between mt-3 mb-3">
                        <span class="fw-bold">TỔNG TIỀN:</span>
                        <span class="text-danger fw-bold fs-5" th:text="${#numbers.formatDecimal(totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">0đ</span>
                    </div>
                    <a th:href="@{/checkout}" class="btn btn-dark w-100 fw-bold py-2">TIẾN HÀNH THANH TOÁN</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
