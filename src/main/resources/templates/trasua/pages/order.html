<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content" class="container py-4">

    <!-- Thông báo động Real-time -->
    <div id="cart-alert-box" class="alert alert-danger alert-dismissible fade show border-0 shadow-sm rounded-4 mb-4 d-none" role="alert">
        <i class="fas fa-exclamation-triangle me-2"></i>
        <span id="cart-alert-text" class="fw-semibold"></span>
        <button type="button" class="btn-close" onclick="document.getElementById('cart-alert-box').classList.add('d-none')"></button>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm rounded-4 mb-4">
        <i class="fas fa-check-circle me-2"></i> <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold text-dark mb-0"><i class="fas fa-shopping-bag text-warning me-2"></i>Giỏ hàng của bạn</h4>
        <a th:if="${!#lists.isEmpty(cartItems)}" href="/cart/clear" 
           onclick="return confirm('Bạn có chắc chắn muốn xóa toàn bộ sản phẩm trong giỏ hàng?');"
           class="btn btn-outline-danger btn-sm rounded-3 fw-semibold">
            <i class="fas fa-trash-alt me-1"></i> Xóa tất cả
        </a>
    </div>

    <!-- Khi giỏ trống -->
    <div th:if="${#lists.isEmpty(cartItems)}" class="card border-0 shadow-sm rounded-4 p-5 text-center bg-white">
        <i class="fas fa-shopping-cart text-muted mb-3" style="font-size: 60px; opacity: 0.3;"></i>
        <h5 class="fw-bold text-dark">Giỏ hàng của bạn đang trống</h5>
        <p class="text-secondary small mb-4">Hãy khám phá thực đơn trà sữa thơm ngon của Soranchi nhé!</p>
        <div>
            <a href="/products" class="btn btn-dark px-4 py-2.5 rounded-3 fw-semibold">Xem thực đơn ngay</a>
        </div>
    </div>

    <!-- Danh sách sản phẩm trong giỏ -->
    <div th:if="${!#lists.isEmpty(cartItems)}" class="row g-4">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4 bg-white p-3">
                <div th:each="item : ${cartItems}" class="cart-row border-bottom py-3 px-2" th:id="'cart-row-' + ${item.id}">
                    <div class="row align-items-center g-3">
                        <!-- Ảnh, Tên & Thông tin chi tiết (Size, Đá/Đường, Topping) -->
                        <div class="col-md-7 d-flex align-items-start gap-3">
                            <img th:src="${item.imageUrl != null and item.imageUrl.startsWith('http') ? item.imageUrl : ('/images/' + item.imageUrl)}"
                                class="rounded-3 border mt-1" width="72" height="72" style="object-fit: cover;"
                                onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/3081/3081162.png';">
                            
                            <div class="flex-grow-1">
                                <h6 class="fw-bold text-dark mb-1" th:text="${item.name}">Tên món</h6>
                                
                                <!-- Chỉ hiển thị Size, Đường/Đá, Topping nếu món có (Đồ uống) -->
                                <div class="d-flex flex-wrap gap-1 mb-2"
                                     th:if="${(item.size != null and !item.size.isEmpty()) or (item.note != null and !item.note.isEmpty()) or (item.toppings != null and !item.toppings.isEmpty())}">
                                    <span th:if="${item.size != null and !item.size.isEmpty()}"
                                          class="badge bg-dark text-warning fw-medium">
                                        <i class="fas fa-glass-whiskey me-1"></i>Size <span th:text="${item.size}">S</span>
                                    </span>

                                    <span th:if="${item.note != null and !item.note.isEmpty()}"
                                          class="badge bg-light text-dark border fw-normal">
                                        <span th:text="${item.note}"></span>
                                    </span>

                                    <span th:if="${item.toppings != null and !item.toppings.isEmpty()}" 
                                          class="badge bg-warning-subtle text-dark border border-warning-subtle fw-medium">
                                        <i class="fas fa-plus-circle text-warning me-1"></i>Topping: <span th:text="${item.toppings}"></span>
                                    </span>
                                </div>

                                <div class="text-danger fw-bold small">
                                    Đơn giá: <span th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')}">0</span>đ
                                </div>
                            </div>
                        </div>

                        <!-- Số lượng, Thành tiền & Nút Xóa -->
                        <div class="col-md-5 d-flex align-items-center justify-content-between justify-content-md-end gap-3">
                            <div class="input-group input-group-sm" style="width: 110px;">
                                <button class="btn btn-outline-secondary fw-bold btn-minus" type="button" th:data-id="${item.id}">-</button>
                                <input type="text" class="form-control text-center fw-bold qty-input" 
                                       th:id="'qty-' + ${item.id}" th:data-id="${item.id}" th:value="${item.quantity}">
                                <button class="btn btn-outline-secondary fw-bold btn-plus" type="button" th:data-id="${item.id}">+</button>
                            </div>

                            <div class="text-end" style="min-width: 95px;">
                                <div class="fw-bold text-dark small mb-1">
                                    <span th:id="'item-total-' + ${item.id}" th:text="${#numbers.formatDecimal(item.price * item.quantity, 0, 'COMMA', 0, 'POINT')}">0</span>đ
                                </div>
                                <a th:href="@{'/cart/remove/' + ${item.id}}" 
                                   onclick="return confirm('Bạn có chắc muốn xóa sản phẩm này khỏi giỏ hàng?');"
                                   class="text-danger small text-decoration-none fw-semibold">
                                    <i class="fas fa-trash me-1"></i>Xóa
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tổng kết đơn hàng -->
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm rounded-4 bg-white p-4">
                <h6 class="fw-bold text-dark border-bottom pb-3 mb-3">Tóm tắt giỏ hàng</h6>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <span class="text-secondary fw-medium">Tổng giá trị đơn hàng:</span>
                    <span class="fs-4 fw-bold text-danger">
                        <span id="cart-grand-total" th:text="${#numbers.formatDecimal(totalPrice, 0, 'COMMA', 0, 'POINT')}">0</span> đ
                    </span>
                </div>
                <a href="/checkout" class="btn btn-dark w-100 py-3 rounded-3 fw-semibold shadow-sm">
                    Tiến hành thanh toán <i class="fas fa-arrow-right ms-2"></i>
                </a>
            </div>
        </div>
    </div>

    <!-- Script Real-time AJAX cho số lượng -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const alertBox = document.getElementById('cart-alert-box');
            const alertText = document.getElementById('cart-alert-text');

            function showAlert(msg) {
                alertText.innerText = msg;
                alertBox.classList.remove('d-none');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            function formatMoney(num) {
                return Math.round(num).toLocaleString('en-US');
            }

            function sendUpdateQty(id, newQty) {
                const formData = new FormData();
                formData.append('id', id);
                formData.append('quantity', newQty);

                fetch('/api/cart/update-qty', { method: 'POST', body: formData })
                    .then(res => res.json())
                    .then(data => {
                        const inputEl = document.getElementById('qty-' + id);
                        if (!data.success) {
                            showAlert(data.message);
                            if (data.errorType === 'INVALID_FORMAT') {
                                inputEl.value = data.oldQty;
                            } else if (data.errorType === 'EXCEED_STOCK') {
                                inputEl.value = data.maxQty;
                                document.getElementById('item-total-' + id).innerText = formatMoney(data.itemTotal);
                                document.getElementById('cart-grand-total').innerText = formatMoney(data.cartTotal);
                            }
                            return;
                        }

                        alertBox.classList.add('d-none');
                        inputEl.value = data.newQty;
                        document.getElementById('item-total-' + id).innerText = formatMoney(data.itemTotal);
                        document.getElementById('cart-grand-total').innerText = formatMoney(data.cartTotal);
                    })
                    .catch(() => showAlert("Mất kết nối đến cơ sở dữ liệu! Giữ nguyên trạng thái cũ."));
            }

            document.querySelectorAll('.btn-minus').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.getAttribute('data-id');
                    const inputEl = document.getElementById('qty-' + id);
                    const val = parseInt(inputEl.value) || 1;
                    if (val <= 1) {
                        showAlert("Số lượng tối thiểu là 1. Nếu muốn bỏ món vui lòng nhấn nút Xóa!");
                    } else {
                        sendUpdateQty(id, val - 1);
                    }
                });
            });

            document.querySelectorAll('.btn-plus').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.getAttribute('data-id');
                    const inputEl = document.getElementById('qty-' + id);
                    const val = parseInt(inputEl.value) || 1;
                    sendUpdateQty(id, val + 1);
                });
            });

            document.querySelectorAll('.qty-input').forEach(input => {
                input.addEventListener('change', function() {
                    const id = this.getAttribute('data-id');
                    sendUpdateQty(id, this.value);
                });
            });
        });
    </script>
</div>

</body>
</html>
