<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content" class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card border-0 shadow-sm rounded-4 text-center p-4 p-md-5 bg-white">
                <div class="mb-3">
                    <span class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 rounded-circle" style="width: 80px; height: 80px;">
                        <i class="fas fa-check-circle text-success" style="font-size: 45px;"></i>
                    </span>
                </div>
                
                <h3 class="fw-bold text-dark mb-2">ĐẶT HÀNG THÀNH CÔNG!</h3>
                <p class="text-secondary small mb-4">
                    Cảm ơn bạn đã lựa chọn trà sữa Soranchi. Đơn hàng của bạn đã được tiếp nhận và lưu trữ vào hệ thống.
                </p>

                <div class="bg-light border rounded-3 p-3 mb-4 text-start small">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-secondary">Mã đơn hàng:</span>
                        <strong class="text-danger font-monospace fs-6" th:text="${successOrderId}">SRC01</strong>
                    </div>
                    <div class="d-flex justify-content-between">
                        <span class="text-secondary">Trạng thái:</span>
                        <span class="badge bg-success-subtle text-success fw-bold px-2 py-1">Đã tiếp nhận</span>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <a href="/my-orders" class="btn btn-dark fw-semibold py-2.5 rounded-3">
                        <i class="fas fa-receipt me-2"></i>Xem đơn hàng của tôi
                    </a>
                    <a href="/" class="btn btn-outline-secondary fw-semibold py-2.5 rounded-3">
                        <i class="fas fa-store me-2"></i>Tiếp tục mua sắm
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
