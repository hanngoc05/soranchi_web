<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content" class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-9 col-lg-8">

            <!-- Thông báo lỗi kiểm tra dữ liệu -->
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show border-0 shadow-sm rounded-3 py-2.5 px-3 small d-flex align-items-center mb-3" role="alert">
                <i class="fas fa-exclamation-circle me-2 text-danger fs-6"></i>
                <span class="fw-medium text-danger" th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" style="padding: 0.9rem;"></button>
            </div>

            <div class="card shadow-sm border-0 rounded-4 overflow-hidden bg-white">
                <div class="card-header bg-dark text-white px-4 py-3">
                    <h5 class="mb-0 fw-bold" th:text="${product.id == 0} ? '➕ THÊM SẢN PHẨM MỚI' : '✏️ CHỈNH SỬA SẢN PHẨM'"></h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/product/save}" th:object="${product}" method="post" id="productForm">
                        
                        <input type="hidden" th:field="*{id}">

                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Mã sản phẩm</label>
                                <input type="text" th:field="*{productCode}" class="form-control rounded-3 font-monospace text-uppercase" placeholder="Ví dụ: TS01" required>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label small fw-bold">Tên sản phẩm</label>
                                <input type="text" th:field="*{name}" class="form-control rounded-3" placeholder="Ví dụ: Trà Sữa Trân Châu Hoàng Kim" required>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Giá tiền (VNĐ)</label>
                                <input type="number" name="price" th:value="${product.price != null ? #numbers.formatDecimal(product.price, 0, 0) : 0}" min="0" step="1000" class="form-control rounded-3" required>                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Số lượng trong kho</label>
                                <input type="number" th:field="*{quantity}" min="0" class="form-control rounded-3" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Danh mục</label>
                                <select th:field="*{category}" class="form-select rounded-3" required>
                                    <option th:each="cat : ${categories}" th:value="${cat.name}" th:text="${cat.name}"></option>
                                </select>
                            </div>

                            <div class="col-md-8">
                                <label class="form-label small fw-bold">Link ảnh / Tên file ảnh</label>
                                <input type="text" th:field="*{imageUrl}" class="form-control rounded-3" placeholder="trasua.jpg hoặc https://..." required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Trạng thái bán</label>
                                <select th:field="*{status}" class="form-select rounded-3">
                                    <option value="ĐANG BÁN">Đang bán</option>
                                    <option value="NGỪNG BÁN">Ngừng bán</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label class="form-label small fw-bold">Mô tả sản phẩm</label>
                                <textarea th:field="*{description}" class="form-control rounded-3" rows="3" placeholder="Mô tả hương vị, nguyên liệu đồ uống..."></textarea>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a th:href="@{/admin/products}" class="btn btn-light px-4 rounded-3">Hủy bỏ</a>
                            <button type="submit" class="btn btn-warning px-4 fw-bold rounded-3" 
                                    onclick="return confirm('Bạn có đồng ý lưu thông tin sản phẩm này không?');">
                                Lưu sản phẩm
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
