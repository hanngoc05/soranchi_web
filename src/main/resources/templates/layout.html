<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="${pageTitle} ?: 'Soranchi'">Soranchi Web</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  
  <style>
      /* 1. KHÓA CỨNG HEADER TRÊN CÙNG TRÌNH DUYỆT */
      header {
          position: fixed !important;
          top: 0;
          left: 0;
          width: 100%;
          z-index: 1030;
          height: 75px;
      }
      
      /* Đẩy body xuống 90px để không bị Header fixed che mất chữ */
      body {
          padding-top: 90px !important;
      }

      /* 2. KHÓA CỨNG SIDEBAR BÊN TRÁI  */
      .sticky-sidebar {
          position: sticky !important;
          top: 95px; /* Khoảng cách neo so với mép trên màn hình dưới Header */
          height: calc(100vh - 120px);
          overflow-y: auto;
      }
      
      /* Tắt thanh cuộn phụ của sidebar */
      .sticky-sidebar::-webkit-scrollbar {
          width: 0px;
      }
  </style>
</head>

<body class="d-flex flex-column min-vh-100">
    
    <div th:replace="~{/trasua/fragments/header :: header}"></div>

    <div class="container-fluid mt-2 flex-grow-1">
      <div class="row g-3">

        <div th:if="${contentTemplate != 'trasua/pages/admin_products' and contentTemplate != 'trasua/pages/category_list'}" 
             class="col-md-3 col-lg-2 sticky-sidebar">
          <div th:replace="~{/trasua/fragments/sidebar :: sidebar}"></div>
        </div>

        <div th:class="${contentTemplate == 'trasua/pages/admin_products' or contentTemplate == 'trasua/pages/category_list'} ? 'col-12' : 'col-md-9 col-lg-10'">
            <div th:replace="~{${contentTemplate} :: ${contentFragment}}"></div>
        </div>

      </div>
    </div>

    <div th:replace="~{/trasua/fragments/footer :: footer}"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
